<div class="row p-4">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Productos</h2>
      @if (authService.isSuperAdmin()) {
        <button (click)="openCreateModal()" type="button" class="btn btn-primary">
          <i class="fas fa-plus me-1"></i> Nuevo producto
        </button>
      }
    </div>
  </div>

  <div class="col-12">
    <app-producto-list
      [productos]="productoService.productos$()"
      (callModalAction)="openEditModal($event)"
      (callDeleteAction)="deleteProducto($event)"
    />
  </div>
</div>

<ng-template #productoModal>
  <app-modal [hideFooter]="true">
    <app-producto-form
      [productoForm]="productoForm"
      [categorias]="categoriaService.categorias$()"
      (callSaveMethod)="saveProducto($event)"
      (callUpdateMethod)="updateProducto($event)"
    />
  </app-modal>
</ng-template>
