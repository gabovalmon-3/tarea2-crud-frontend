@defer {
  <div class="row p-4">
    <div class="col-12">
      <h2 class="mb-3">Usuarios</h2>
    </div>
    <div class="col-12">
      <app-user-list [users]="userService.users$()" />
      @if (userService.users$().length) {
        <app-pagination [service]="userService" />
      }
    </div>
  </div>
} @loading (minimum 1.5s) {
  <app-loader></app-loader>
}
